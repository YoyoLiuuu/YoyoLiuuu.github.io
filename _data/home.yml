# --- What I've built ---------------------------------------------------------
# `result` is one measured outcome, in the SOP's wording.
built:
  - title: "Representations"
    text: "Building what the science already knows into what a model sees."
    result: "Within about 2 mHa of SchNet up to about 200 training molecules."
    icon: molecule
    color: "#7a2a6c"
    tags: ["NeurIPS 2026 WiML", "AAAI 2026 UC", "CUCAI 2025", "Cell Systems (in review)"]
  - title: "Reasoning"
    text: "Latent reasoning in a chemistry language model, and when a model's confidence can be relied on."
    result: "Beats chain-of-thought in about 60% of non-tied comparisons, with a tenth of the reasoning steps."
    icon: route
    color: "#c2185b"
    tags: ["ICML 2026", "ICML 2026 WiML"]
  - title: "Agents"
    text: "An agent that analyzes experiments in a self-driving lab, under human control."
    result: "Found the best of 28 conditions in every replayed run of 8+ measurements."
    icon: flask
    color: "#e0527f"
    tags: ["NeurIPS 2026 AI4Mat"]

# --- Where I'm heading -------------------------------------------------------
heading:
  lede: "In my PhD, I hope to work on both the machine learning models and the agentic systems behind scientific discovery: how models can best represent and reason about molecules, including where data and compute are limited, and how agents built on them can be trusted in the lab, from reliable decisions to resisting adversarial inputs. I'm also excited to explore new directions where these questions lead."
  figure_scene: gate
  figure_title: "Checks before every action"
  figure_note: "Cheap enough to run every time: safe actions pass, risky ones stop for review."
  # `status` is the roadmap box each direction belongs to.
  directions:
    - title: "When does built-in structure still help?"
      status: "Understand"
      text: "Do the gains from symmetry and geometry vanish with scale, and what are they worth where data or compute is limited?"
      icon: layers
    - title: "Geometry and language together"
      status: "Improve"
      text: "Models that reason over molecules and text at once, and whether each makes the other better."
      icon: molecule
    - title: "What is the model actually doing?"
      status: "Trust"
      text: "Latent reasoning leaves no steps to read. Turn what it does into checks cheap enough to run before an agent acts."
      icon: eye
    - title: "Checks that hold on adversarial inputs"
      status: "Trust"
      text: "What an agent reads in the lab shouldn't get to choose its actions."
      icon: shield
  map_intro: "The full map, from molecules to agents in the lab. Click a node."


# --- Where I'm heading -------------------------------------------------------
heading:
  lede: "I want to understand what chemistry models actually learn, use that to make them better, and know when they can be trusted in the lab."
  figure_scene: gate
  figure_title: "Checks before every action"
  figure_note: "Cheap enough to run every time: safe actions pass, risky ones stop for review."
  directions:
    - title: "Does the model use chemistry, or only contain it?"
      text: "Follow its reasoning against chemical motifs and 3D geometry."
      icon: eye
    - title: "Geometry and language together"
      text: "Models that reason over molecules and text at once."
      icon: molecule
    - title: "Checks cheap enough to use"
      text: "So an agent can verify before it acts in the lab."
      icon: shield
  map_intro: "The full map, from molecules to agents in the lab. Click a node."


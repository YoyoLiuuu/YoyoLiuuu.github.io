# Content for the homepage graphics (layout: _layouts/home.html).
# Keep every `text` to one short line: the page is meant to be scanned.
# `icon` is a name from _includes/icon.html.

# --- Roadmap at the top: built -> now -> next -------------------------------
# Each box opens a drawing when clicked. `scene` picks the drawing:
# molecule, latent, loop, trajectory, gate, lens or edit (see assets/js/).
roadmap:
  built_label: "What I've built"
  now_label: "Now"
  next_label: "Where I'm heading"
  hint: "click a box to see it"
  built:
    - title: "Representations"
      text: "molecules, RNA, proteins"
      icon: molecule
      color: "#7a2a6c"
      scene: molecule
      scene_title: "Give the model what the science knows"
      scene_note: "Symmetry and geometry go into the representation. This one is HBDI, the GFP chromophore from my time in the Brown Lab."
      scene_hint: "drag to rotate"
    - title: "Reasoning"
      text: "chemical language models"
      icon: route
      color: "#c2185b"
      scene: latent
      scene_title: "Reasoning in latent space"
      scene_note: "LatentChem reasons in continuous vectors instead of words. Similar chemistry seems to end up in nearby regions."
    - title: "Agents"
      text: "self-driving labs"
      icon: flask
      color: "#e0527f"
      scene: loop
      scene_title: "An agent inside the experiment"
      scene_note: "The agent analyzes results and designs the next step. Anything that changes the lab waits for human approval."
  next:
    - title: "Understand"
      text: "what has the model learned about chemistry?"
      icon: eye
      scene: lens
      scene_title: "Is the chemistry really in there?"
      scene_note: "Do a model's internal states line up with real chemical structure, like motifs and 3D geometry, and does it use them?"
      scene_hint: "move your cursor to probe"
    - title: "Improve"
      text: "reason over geometry and language"
      icon: molecule
      scene: edit
      scene_title: "Better chemistry, not just better scores"
      scene_note: "If that structure is real, can it steer molecular design better than text prompting?"
    - title: "Trust"
      text: "know when to verify in the lab"
      icon: shield
      scene: trajectory
      scene_title: "Checked at every step"
      scene_note: "Can a model flag when its reasoning leaves the chemistry it was validated on, before an agent acts?"
      scene_hint: "move your cursor to steer"

